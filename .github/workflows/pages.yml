name: Deploy to GitHub Pages

# Pages for this repo is served straight from the `main` branch (Settings → Pages →
# Source → Deploy from a branch), so this workflow does not run on push — it would
# fail on every commit for want of an Actions-source Pages site. Switch the source to
# GitHub Actions and put the push trigger back to hand deploys to this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site automatically if it isn't enabled yet.
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo is the site — index.html lives at the root.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
